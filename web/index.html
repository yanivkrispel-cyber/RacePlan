<script>
(function () {

  var LOGO = bootLogo ? bootLogo.outerHTML : '';

  // the course of the saved plan, else a sample loop: [[x, y]] in screen space (y down)
  function course(track, dist) {
    var pts = [], d = dist || 0;
    if (!track) {
      try {
        var p = JSON.parse(localStorage.getItem('rp-plan-v1') || 'null'), c = p && p.c;
        if (c && c.track && c.track.length > 8) { track = c.track; d = c.dist || 0; }

  // the line fast, lights the logo, fades out and calls cb.

    var dot = el('circle', { r: 4.6, fill: '#F4FFD0' }, svg);
