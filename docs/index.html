<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>RacePlan</title>

<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#0a0a0c" />
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />

<!-- iOS home-screen -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="RacePlan" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />

<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0a0a0c; overflow: hidden; }
  #app { position: fixed; inset: 0; width: 100%; height: 100dvh; border: 0; background: #0a0a0c; }

  /* loading / first-time sign-in overlay */
  #load {
    position: fixed; inset: 0; z-index: 3; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; padding: 24px;
    background: #0a0a0c; color: #B6F03C; text-align: center;
    font: 600 15px/1.5 "Heebo", system-ui, sans-serif;
    transition: opacity .4s ease;
  }
  #load.hidden { opacity: 0; pointer-events: none; }
  #load .ring {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid rgba(182,240,60,.28); border-top-color: #B6F03C;
    animation: spin 1s linear infinite;
  }
  #load .hint { color: #9BA0B7; font-weight: 500; font-size: 13px; max-width: 320px; }
  .cta {
    display: inline-block; padding: 12px 22px; border-radius: 10px;
    background: #B6F03C; color: #0a0a0c; font-weight: 700; font-size: 15px; text-decoration: none;
  }
  #load .ring, #load .cta { display: none; }
  #load.loading .ring { display: block; }
  #load.needauth .cta { display: inline-block; }

  /* persistent escape hatch — open in a real tab (auth screens don't frame) */
  #opentab {
    position: fixed; z-index: 4; inset-block-start: max(8px, env(safe-area-inset-top));
    inset-inline-start: 8px; padding: 6px 10px; border-radius: 999px;
    background: rgba(20,20,22,.8); color: #B6F03C; font: 600 12px "Heebo", system-ui, sans-serif;
    text-decoration: none; backdrop-filter: blur(6px); border: 1px solid rgba(182,240,60,.32);
  }

  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #load .ring { animation: none; } }
</style>
</head>
<body>
<div id="load" class="loading">
  <div class="ring"></div>
  <div id="msg">RacePlan נטען…</div>
  <a class="cta" id="signin" href="#" target="_blank" rel="noopener">התחברות עם Google</a>
  <div class="hint" id="hint"></div>
</div>

<a id="opentab" href="#" target="_blank" rel="noopener">↗ פתח בכרטיסייה</a>

<iframe
  id="app"
  title="RacePlan"
  src="https://script.google.com/macros/s/AKfycbymEZ1ClOZdly4acorn5lPrCHGXCD2ExjKGqa9q0SxuDD8aavnbektYa24ecM3MCUCffg/exec"
  allow="clipboard-write; geolocation"
  referrerpolicy="no-referrer-when-downgrade"
></iframe>

<script>
  var frame  = document.getElementById('app');
  var EXEC   = frame.src;
  var loader = document.getElementById('load');
  var msg    = document.getElementById('msg');
  var hint   = document.getElementById('hint');
  document.getElementById('signin').href = EXEC;
  document.getElementById('opentab').href = EXEC;

  var loaded = false;
  frame.addEventListener('load', function () { loaded = true; setTimeout(function () {
    if (loaded) loader.classList.add('hidden');
  }, 600); });

  // First open needs Google authorization, and Google's consent screen refuses
  // to render in an iframe. If the app frame isn't up in a few seconds, show a
  // top-level sign-in link.
  setTimeout(function () {
    if (loaded) return;
    loader.classList.remove('loading');
    loader.classList.add('needauth');
    msg.textContent = 'פתיחה ראשונה — צריך להתחבר';
    hint.textContent = 'לחצו "התחברות עם Google", אשרו את ההרשאות (יופיע מסך "אפליקציה לא מאומתת" → Advanced → המשך), ואז חזרו לכאן.';
  }, 4500);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
