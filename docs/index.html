<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>RacePlan</title>

<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#0a0a0c" />
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />

<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="RacePlan" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />

<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0a0a0c; overflow: hidden; }
  #app { position: fixed; inset: 0; width: 100%; height: 100dvh; border: 0; background: #0a0a0c; }

  /* launch / sign-in overlay — always shows a real button, never a bare 401 */
  #load {
    position: fixed; inset: 0; z-index: 3; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px; padding: 28px;
    background: #0a0a0c; color: #eef0e6; text-align: center;
    font: 600 15px/1.5 "Heebo", system-ui, sans-serif;
    transition: opacity .35s ease;
  }
  #load.hidden { opacity: 0; pointer-events: none; }
  #load img { width: 108px; height: 108px; border-radius: 22px; }
  #load .row { display: flex; align-items: center; gap: 9px; color: #9aa08c; font-size: 13px; }
  #load .ring {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid rgba(182,240,60,.25); border-top-color: #B6F03C;
    animation: spin 1s linear infinite;
  }
  .cta {
    display: inline-block; padding: 13px 26px; border-radius: 12px;
    background: #B6F03C; color: #0a0a0c; font-weight: 800; font-size: 15px;
    text-decoration: none; box-shadow: 0 6px 24px rgba(182,240,60,.22);
  }
  #load .hint { color: #8b8f7e; font-weight: 500; font-size: 12.5px; max-width: 320px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #load .ring { animation: none; } }
</style>
</head>
<body>
<div id="load">
  <img src="icon-512.png" alt="RACE PLAN" />
  <a class="cta" id="open" href="#" target="_blank" rel="noopener">פתח את RacePlan</a>
  <div class="row"><span class="ring"></span><span id="msg">בודק חיבור…</span></div>
  <div class="hint" id="hint"></div>
</div>

<iframe
  id="app"
  title="RacePlan"
  src="https://script.google.com/macros/s/AKfycbymEZ1ClOZdly4acorn5lPrCHGXCD2ExjKGqa9q0SxuDD8aavnbektYa24ecM3MCUCffg/exec"
  allow="clipboard-write; geolocation"
  referrerpolicy="no-referrer-when-downgrade"
></iframe>

<script>
  var frame  = document.getElementById('app');
  var EXEC   = frame.src;
  var loader = document.getElementById('load');
  var msg    = document.getElementById('msg');
  var hint   = document.getElementById('hint');
  document.getElementById('open').href = EXEC;

  // The real app posts 'raceplan:ready' once it mounts. A 401 / Google auth
  // page never does — so this reliably distinguishes "app running" from
  // "needs sign-in", which we can't tell from the iframe's load event alone.
  var ready = false;
  window.addEventListener('message', function (e) {
    if (e.data !== 'raceplan:ready') return;
    if (!/\.googleusercontent\.com$/.test(new URL(e.origin).hostname)) return;
    ready = true;
    loader.classList.add('hidden');
  });

  // No ready ping in a few seconds → the frame is almost certainly the Google
  // sign-in / "authorization required" wall (it won't render in an iframe).
  setTimeout(function () {
    if (ready) return;
    msg.textContent = 'צריך להתחבר עם Google';
    hint.textContent = 'פתיחה ראשונה: לחצו "פתח את RacePlan", התחברו ואשרו את ההרשאות ' +
      '(יופיע מסך "אפליקציה לא מאומתת" → Advanced → המשך), ואז חזרו לכאן.';
    loader.querySelector('.ring').style.display = 'none';
  }, 3500);

  // Back from the sign-in tab? Retry the frame — they may have just authorized.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && !ready) {
      frame.src = EXEC + (EXEC.indexOf('?') === -1 ? '?' : '&') + 'r=' + Date.now();
    }
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
